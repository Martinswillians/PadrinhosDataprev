<style>
:root{--pine:#123628;--pine2:#1d4d3a;--berry:#a3202f;--berry2:#861926;--gold:#d6a24a;--snow:#f4f8f5;--frost:#dce8e2;--ink:#0e211a;--mute:#5b6f66;--line:#cfdcd5;--white:#fff;
--serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 var(--sans);color:var(--ink);background:var(--snow)}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2.1rem,5vw,3.6rem)}h2{font-size:clamp(1.6rem,3vw,2.2rem)}h3{font-size:1.2rem}
a{color:var(--berry)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{background:var(--pine);color:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;color:#fff;text-decoration:none;margin-right:auto}
.brand i{color:var(--gold);font-style:normal}
nav.n a,nav.n button{color:#e6efe9;text-decoration:none;font:500 .95rem var(--sans);background:none;border:0;cursor:pointer;padding:6px 10px;border-radius:6px}
nav.n a:hover,nav.n button:hover{background:var(--pine2)}
nav.n{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--berry);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:600 1rem var(--sans);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--berry2)}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{background:#c4903b}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{background:var(--frost)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.danger{background:#fff;color:var(--berry);border:1.5px solid var(--berry)}
.btn:disabled{opacity:.5;cursor:wait}
.hero{background:var(--pine);color:#fff;padding:56px 0 70px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.hero p.lead{font-size:1.15rem;color:#cfe0d6;max-width:46ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .prazo{display:inline-block;margin-top:22px;color:var(--gold);font-weight:600}
.bigtag{background:#fff;color:var(--ink);border-radius:10px 10px 18px 18px;padding:46px 28px 28px;transform:rotate(4deg);position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35);max-width:300px;justify-self:center}
.bigtag:before{content:"";position:absolute;top:14px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--pine);box-shadow:0 0 0 4px var(--gold)}
.bigtag:after{content:"";position:absolute;top:-70px;left:50%;width:2px;height:84px;background:var(--gold);transform:rotate(-8deg);transform-origin:bottom}
.bigtag small{color:var(--mute);display:block}
.bigtag .para{font-family:var(--serif);font-size:1.9rem;font-weight:700;line-height:1.1;margin:2px 0 16px}
.bigtag .msg{font-family:var(--serif);font-style:italic;color:var(--berry);font-size:1.1rem;border-top:1px dashed var(--line);padding-top:14px}
section.s{padding:56px 0}
section.s.alt{background:var(--white);border-block:1px solid var(--line)}
.prose{max-width:68ch;font-family:var(--serif);font-size:1.15rem;line-height:1.7}
.prose p{margin:0 0 1em}
.regras{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:28px}
.regras div{border-left:4px solid var(--gold);padding:4px 0 4px 16px}
.regras b{display:block;font-family:var(--serif);font-size:1.15rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:22px 0}
.stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px}
.stat b{display:block;font:700 2.3rem var(--serif);line-height:1}
.stat span{color:var(--mute);font-size:.92rem}
.stat.ok b{color:var(--pine2)}.stat.falta b{color:var(--berry)}
.bar{height:14px;background:var(--frost);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pine2),var(--gold));border-radius:99px}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.prof .bar{height:8px;margin-top:6px}.prof small{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:500 .93rem var(--sans)}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 22px;padding-top:14px}
.tag{background:#fff;border:1px solid var(--line);border-radius:10px 10px 16px 16px;padding:40px 18px 20px;position:relative;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.tag:before{content:"";position:absolute;top:12px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--snow);box-shadow:0 0 0 3px var(--gold),inset 0 0 0 1px var(--line)}
.tag:after{content:"";position:absolute;top:-16px;left:50%;width:2px;height:30px;background:var(--gold)}
.tag .role{color:var(--berry);font-weight:600}
.tag .desc{color:var(--mute);font-size:.94rem;flex:1}
.av{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--frost);display:grid;place-items:center;font:700 2rem var(--serif);color:var(--pine2);border:3px solid var(--gold)}
.av.sm{width:42px;height:42px;font-size:1rem;border-width:2px}.av.lg{width:170px;height:170px;font-size:3rem}
.done{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.done .av{opacity:.8;border-color:var(--pine2)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;max-width:560px;margin:40px auto}
.box.wide{max-width:900px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.msg-ok,.msg-info{padding:12px 14px;border-radius:8px;margin:14px 0}
.msg-ok{background:#e3f1e8;border:1px solid #b6d7c2}.msg-info{background:#fbf2dc;border:1px solid #ecd391}
.perfil{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start}
.fotobox{display:flex;gap:14px;align-items:center}.fotobox img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--frost);border:2px solid var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:24px 0}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink);font-weight:600;border-radius:8px 8px 0 0}
.tabs a.on{background:var(--pine);color:#fff}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;margin:14px 0 26px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--frost);font-weight:600;white-space:nowrap}
td .btn{margin:2px 2px 2px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600}
.pill.ok{background:#d8eddf;color:#1d5a37}.pill.no{background:#f9dcdf;color:var(--berry2)}
dialog{border:0;border-radius:14px;padding:26px;width:min(560px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,30,22,.6)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;z-index:99;display:none;max-width:90vw}
footer{background:var(--pine);color:#a9c2b5;padding:28px 0;text-align:center;font-size:.9rem}
.load{text-align:center;padding:80px 0;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.seg{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:8px 0 18px}
.seg button{border:0;background:none;padding:10px 16px;font:600 1rem var(--sans);cursor:pointer;border-radius:8px 8px 0 0;color:var(--ink)}
.seg button.on{background:var(--pine);color:#fff}
.tag .pill{align-self:center}
.req{color:var(--berry);font-weight:700}
.nota{color:var(--mute);font-size:.88rem;margin:12px 0 0}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 6px;align-items:center}
.pill.an{background:#fbf0c9;color:#7a5800}
.itens{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:18px 0}
.prod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.prod img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:10px}
.prod .ph{aspect-ratio:4/3;display:grid;place-items:center;background:var(--frost);border-radius:10px;font-size:3.4rem}
.prod h3{margin:6px 0 0;font-size:1.25rem}.prod p{margin:0;color:var(--mute);flex:1}.prod .preco{font:700 1.5rem var(--serif);color:var(--berry)}
.itens.mini{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.itens.mini .prod{padding:10px}.itens.mini .prod img{max-height:130px}.itens.mini .prod h3{font-size:1rem}
.doadores{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0}.doador{display:flex;flex-direction:column;align-items:center;width:92px;text-align:center;font-size:.85rem;gap:6px;line-height:1.2}.av.md{width:64px;height:64px;font-size:1.3rem}
.instbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:10px 12px;display:flex;gap:10px;align-items:center;max-width:560px;margin:0 auto}
.instbar img{border-radius:10px}.instbar div{flex:1;line-height:1.25;font-size:.92rem}.instbar .x{background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--mute);padding:0 4px;line-height:1}
.passosgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:18px}.passos{padding-left:20px;margin:8px 0}.passos li{margin:9px 0}
.sel{display:inline-block;background:var(--gold);color:var(--ink);border-radius:99px;padding:1px 10px;font:700 .75rem var(--sans);margin-left:8px;vertical-align:middle}
.zap{background:#e7f6ec;border:1px solid #b9e2c6;border-radius:12px;padding:14px;white-space:pre-wrap;font-size:.95rem;max-width:560px;margin:10px 0 14px}
.pix{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center;margin:10px 0}.chave{font:700 1.5rem var(--serif);word-break:break-all;margin:6px 0}
@media(max-width:700px){.pix{grid-template-columns:1fr}}
.cnt{color:var(--mute);margin:4px 0 0;font-size:.92rem}
.qr{width:min(260px,100%);margin:10px auto;border:1px solid var(--line);border-radius:12px;overflow:hidden}.qr svg{display:block;width:100%;height:auto}.urlq{word-break:break-all;color:var(--mute);font-size:.82rem}

  if(f.t==="foto")return `<label>${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><div class="fotobox"><img data-foto data-v="${esc(v)}" src="${v||"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}" alt=""><input type="file" accept="image/*" data-max="${f.max||360}" onchange="W.foto(this)"></div>`;
  if(f.t==="arquivo")return `<label for="${id}">${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><input id="${id}" name="${f.k}" type="file" accept="image/*,application/pdf" ${r}>`;
  if(f.t==="select")return `<label for="${id}">${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><select id="${id}" name="${f.k}" ${r}>${f.o.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  if(f.t==="textarea")return `<label for="${id}">${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  return `<label for="${id}">${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><input id="${id}" name="${f.k}" type="${f.t||"text"}" value="${esc(v)}" ${r} ${f.t==="number"?'step="any"':""} ${f.t==="password"?'minlength="6" autocomplete="new-password"':""}>`;
}
function read(form,fields){const v={};fields.forEach(f=>{if(f.t==="arquivo")v[f.k]=form.elements[f.k].files[0]||null;else if(f.t==="foto")v.foto=form.querySelector("[data-foto]").dataset.v||"";else{v[f.k]=form.elements[f.k].value.trim();if(f.t==="number")v[f.k]=v[f.k]?+v[f.k]:null}});return v}
function resize(file,max=480){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};i.onerror=no;i.src=r.result};r.readAsDataURL(file)})}

const emv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
const asc=(t,n)=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").trim().slice(0,n)||"NATAL SOLIDARIO";
function pixPayload(tipo,chave,valor,nome,cidade){
  const dig=String(chave||"").replace(/\D/g,"");
  const k=tipo==="Telefone"?(String(chave).startsWith("+")?String(chave).replace(/[^\d+]/g,""):"+55"+dig):tipo==="CPF/CNPJ"?dig:String(chave||"").trim();
  const p=emv("00","01")+emv("01","12")+emv("26",emv("00","br.gov.bcb.pix")+emv("01",k))+emv("52","0000")+emv("53","986")+(valor>0?emv("54",Number(valor).toFixed(2)):"")+emv("58","BR")+emv("59",asc(nome,25))+emv("60",asc(cidade||"BRASILIA",15))+emv("62",emv("05","***"))+"6304";
  return p+crc16(p);
}
async function lerComprovante(file){
  if(file.type.startsWith("image/")){let d=await resize(file,1200);if(d.length>850000)d=await resize(file,800);return {dados:d,tipo:"image/jpeg",nome:file.name}}
  if(file.type==="application/pdf"){if(file.size>650*1024)throw new Error("O PDF tem mais de 650 KB. Envie uma foto ou print do comprovante, ou um PDF menor.");
    const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});return {dados:d,tipo:"application/pdf",nome:file.name}}
  throw new Error("Envie uma imagem (foto ou print) ou um PDF.");
}

function thumb(src,px=96){return new Promise(ok=>{if(!src)return ok("");const i=new Image();i.onload=()=>{const s=Math.max(px/i.width,px/i.height),w=i.width*s,h=i.height*s,c=document.createElement("canvas");c.width=c.height=px;c.getContext("2d").drawImage(i,(px-w)/2,(px-h)/2,w,h);ok(c.toDataURL("image/jpeg",.7))};i.onerror=()=>ok("");i.src=src})}

  if(c.exists())S.cfg={...S.cfg,...c.data()};
  if(!c.exists()||c.data().itensVersao!==2||!Array.isArray(S.cfg.itens)||!S.cfg.itens.length)S.cfg.itens=DEFAULT_ITENS;
  try{const p=await getDoc(doc(db,"config","prestacao"));S.prest=p.exists()?p.data():{}}catch{S.prest={}}
  S.gastos=[];if(S.prest.publicada){try{S.gastos=(await getDocs(query(collection(db,"gastos"),where("ano","==",S.cfg.ano)))).docs.map(d=>({id:d.id,...d.data()}))}catch{}}

const comTempo=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(Object.assign(new Error("O carregamento demorou mais que o esperado."),{code:"timeout"})),ms))]);
let renderSeq=0;
async function render(keep){
  const seq=++renderSeq;
  if(keep===true){S.pubTs=0;S.admTs=0}
  const [path,qs]=location.hash.slice(1).split("?"),p=(path||"/").split("/").filter(Boolean),q=new URLSearchParams(qs||""),tmo=window.__tmo||25000;
  let lento;
  if(!keep){$("#app").innerHTML='<p class="load">Carregando…</p>';lento=setTimeout(()=>{if(seq===renderSeq){const l=document.querySelector("#app .load");if(l)l.innerHTML='Ainda carregando… sua conexão pode estar lenta.<br><small>Se demorar, <a href="javascript:location.reload()">toque aqui para recarregar</a>.</small>'}},7000)}
  try{
    await comTempo(loadPublic(),tmo);
    const views={home,entrar,cadastro,acesso,contribuir,perfil,atividades,instalar,admin};
    const html=await comTempo((views[p[0]||"home"]||home)(p,q),tmo+5000);
    if(seq!==renderSeq)return;
    $("#app").innerHTML=html;ajustarStats();
    if(p[0]==="#presentear")document.getElementById("presentear")?.scrollIntoView();else if(!keep)window.scrollTo(0,0);
  }catch(e){
    if(seq!==renderSeq)return;
    console.error(e);const demora=e.code==="timeout",neg=e.code==="permission-denied"||/permission/i.test(e.message);
    $("#app").innerHTML=`<div class="box"><h2>${demora?"Está demorando para carregar":"Não foi possível carregar"}</h2><p>${demora?"A conexão com o servidor está lenta ou instável. Verifique sua internet e tente novamente.":neg?"O Firebase negou o acesso aos dados. As regras publicadas no Firestore não correspondem a esta versão do site: publique o arquivo firestore.rules mais recente em Firestore > Regras.":"Verifique a conexão e se o Firestore foi criado no projeto."}</p><p><small>Detalhe técnico: ${esc(e.code||"")} ${esc(e.message)}</small></p><div class="row"><button class="btn" onclick="location.reload()">Tentar novamente</button><button class="btn ghost" onclick="W.limparApp()">Limpar dados do app e recarregar</button></div></div>`}
  finally{clearTimeout(lento)}
}

    catch(x){toast(x.code==="permission-denied"?"O Firebase negou o envio. Avise o administrador para republicar as regras do Firestore.":(x.message||"Não foi possível enviar."))}b.disabled=false},
  async reenviar(id){const f=await pedirArquivo("Reenviar comprovante","Anexe o novo comprovante do PIX.");if(!f)return;
    try{const cp=await lerComprovante(f),b=writeBatch(db);b.update(doc(db,"contribuicoes",id),{status:"em_analise",comprovanteNome:cp.nome.slice(0,120),enviadoEm:serverTimestamp(),obsAdmin:""});
      b.set(doc(db,"comprovantes",id),{servidorId:S.user.uid,ano:S.cfg.ano,dados:cp.dados,tipo:cp.tipo,nome:cp.nome.slice(0,120),enviadoEm:serverTimestamp()});

  async verComp(id){try{const d=await getDoc(doc(db,"comprovantes",id));if(!d.exists())return toast("Não há comprovante anexado.");W.abrirArq(d.data(),"Comprovante")}catch(x){toast("Erro: "+(x.code||x.message))}},
  async verGasto(id){try{const d=await getDoc(doc(db,"gastosArq",id));if(!d.exists())return toast("Não há comprovante anexado.");W.abrirArq(d.data(),"Comprovante do gasto")}catch(x){toast("Erro: "+(x.code||x.message))}},
  async abrirArq(c,tit){if(c.tipo==="application/pdf"){const blob=await (await fetch(c.dados)).blob();window.open(URL.createObjectURL(blob),"_blank");return}
    const dl=$("#dlg");dl.innerHTML=`<h2>${tit}</h2><p>${esc(c.nome||"")}</p><img src="${c.dados}" alt="${tit}" style="max-width:100%;border:1px solid var(--line);border-radius:8px"><div class="row"><button class="btn ghost" onclick="dlg.close()">Fechar</button></div>`;dl.showModal()},
  async mudarStatus(id,status,motivo,acao,det){const x=S.adm.contrib.find(z=>z.id===id),b=writeBatch(db);

    lg(b,acao,`${det} de ${x.servidorNome} (${brl(x.valor)})${motivo?". Motivo: "+motivo:""}`,x.servidorNome);await b.commit()},
  async confirmar(id){if(!confirm("Confirmar o recebimento desta contribuição?"))return;try{await W.mudarStatus(id,"confirmado","","contribuicao_confirmada","Confirmou a contribuição");toast("Contribuição confirmada.");render(true)}catch(x){toast("Erro: "+(x.code||x.message))}},
  async recusar(id){const x=S.adm.contrib.find(z=>z.id===id);const m=await pedirMotivo("Recusar comprovante",`Informe por que o comprovante de <b>${esc(x.servidorNome)}</b> não pode ser aceito. O servidor verá o motivo e poderá reenviar.`,"Recusar");if(m===null)return;

  async desfazerConf(id){const x=S.adm.contrib.find(z=>z.id===id);const m=await pedirMotivo("Desfazer confirmação",`A contribuição de <b>${esc(x.servidorNome)}</b> voltará para "Em análise".`,"Desfazer confirmação");if(m===null)return;
    try{await W.mudarStatus(id,"em_analise",m,"contribuicao_desfeita","Desfez a confirmação");toast("Confirmação desfeita.");render(true)}catch(e){toast("Erro: "+(e.code||e.message))}},
  async delContrib(id){const x=S.adm.contrib.find(z=>z.id===id);const m=await pedirMotivo("Excluir contribuição",`Você vai excluir a contribuição de <b>${esc(x.servidorNome)}</b> (${brl(x.valor)}) e o comprovante enviado.`,"Excluir");if(m===null)return;

  regManual(sid){const lab=s=>s.nome+" ("+(s.area||"sem área")+")",s0=sid?S.adm.serv.find(x=>x.id===sid):null;
    const FC=[{k:"servidor",l:"Servidor",t:"select",o:S.adm.serv.map(lab),req:1},{k:"valor",l:"Valor recebido (R$)",t:"number",req:1},{k:"obs",l:"Observação (ex.: pago em dinheiro)"},{k:"comprovante",l:"Comprovante de pagamento (foto, print ou PDF)",t:"arquivo"}];
    modal("Registrar contribuição",FC,{servidor:s0?lab(s0):"",valor:S.cfg.valorContribuicao,obs:""},async v=>{const s=S.adm.serv.find(x=>lab(x)===v.servidor);if(!s)throw new Error("Escolha o servidor.");if(!(v.valor>0))throw new Error("Informe o valor.");

      b.set(ref,{...dados,criadoEm:serverTimestamp(),confirmadoEm:serverTimestamp()});
      if(cp)b.set(doc(db,"comprovantes",ref.id),{servidorId:s.id,ano:S.cfg.ano,dados:cp.dados,tipo:cp.tipo,nome:cp.nome.slice(0,120),enviadoEm:serverTimestamp()});
      await resumoDe(b,[...S.adm.contrib,{id:ref.id,...dados}]);
      lg(b,"contribuicao_manual",`Registrou contribuição de ${brl(v.valor)} de ${s.nome}${v.obs?". Obs.: "+v.obs:""}`,s.nome);await b.commit()})},
  editGasto(id){const g=id?S.adm.gastos.find(x=>x.id===id):null;
    const FG=[{k:"tipo",l:"Tipo",t:"select",o:TIPOS,req:1},{k:"descricao",l:"Descrição (ex.: 7 Chocottones Bauducco)",req:1},{k:"quantidade",l:"Quantidade",t:"number"},{k:"valor",l:"Valor total (R$)",t:"number",req:1},{k:"data",l:"Data",t:"date",req:1},{k:"foto",l:"Comprovante (foto ou print da nota)",t:"foto",max:1400}];
    modal(g?"Editar gasto":"Registrar gasto",FG,{...(g||{}),foto:""},async v=>{if(!(v.valor>0))throw new Error("Informe o valor.");
      const ref=g?doc(db,"gastos",g.id):doc(collection(db,"gastos")),b=writeBatch(db);

      if(v.foto)b.set(doc(db,"gastosArq",ref.id),{ano:S.cfg.ano,dados:v.foto,tipo:"image/jpeg",nome:"comprovante.jpg"});
      lg(b,g?"gasto_alterado":"gasto_registrado",(g?"Alterou":"Registrou")+` o gasto "${v.descricao}" de ${brl(v.valor)}`,"");await b.commit()})},
  async delGasto(id){const g=S.adm.gastos.find(x=>x.id===id);if(!confirm("Excluir este gasto e o comprovante?"))return;try{const b=writeBatch(db);b.delete(doc(db,"gastos",id));b.delete(doc(db,"gastosArq",id));lg(b,"gasto_excluido",`Excluiu o gasto "${g.descricao}" de ${brl(g.valor)}`,"");await b.commit();render(true)}catch(x){toast("Erro: "+(x.code||x.message))}},
  async publicarPrestacao(pub){if(pub&&!confirm("Disponibilizar a prestação de contas para todos os servidores?"))return;try{const b=writeBatch(db);b.set(doc(db,"config","prestacao"),{publicada:pub,...(pub?{publicadaEm:serverTimestamp()}:{})},{merge:true});lg(b,pub?"prestacao_publicada":"prestacao_ocultada",pub?"Disponibilizou a prestação de contas":"Ocultou a prestação de contas","");await b.commit();toast(pub?"Prestação de contas disponível.":"Prestação de contas oculta.");render(true)}catch(x){toast("Erro: "+(x.code||x.message))}},

  async anexar(id){const x=S.adm.contrib.find(z=>z.id===id);const f=await pedirArquivo(x.comprovanteNome?"Trocar comprovante":"Anexar comprovante",`Comprovante da contribuição de <b>${esc(x.servidorNome)}</b> (${brl(x.valor)}).`);if(!f)return;

      b.set(doc(db,"comprovantes",id),{servidorId:x.servidorId,ano:S.cfg.ano,dados:cp.dados,tipo:cp.tipo,nome:cp.nome.slice(0,120),enviadoEm:serverTimestamp()});
      lg(b,"contribuicao_comprovante",`Anexou o comprovante da contribuição de ${x.servidorNome} (${brl(x.valor)})`,x.servidorNome);await b.commit();toast("Comprovante anexado.");render(true)}catch(e){toast(e.message||"Erro ao anexar.")}},
  async sincDoadores(){try{const b=writeBatch(db);await resumoDe(b,S.adm.contrib);await b.commit();S.pubTs=0;await loadPublic();toast("Lista de quem contribuiu atualizada.");render(true)}catch(x){toast("Erro: "+(x.code||x.message))}},
  csvContrib(){csv([["Servidor","Área","Valor","Status","Enviado em","Observação"],...[...S.adm.contrib].sort((a,b)=>a.servidorNome.localeCompare(b.servidorNome,"pt-BR",{sensitivity:"base"})).map(x=>[x.servidorNome,x.area,x.valor,(ST[x.status]||[x.status])[0],dh(x.enviadoEm||x.criadoEm),x.obsAdmin||""])],"contribuicoes.csv")},

  async delAp(id){if(!confirm("Excluir este terceirizado?"))return;const b=writeBatch(db),n0=S.ap.find(y=>y.id===id)?.nome||"";b.delete(doc(db,"apadrinhados",id));b.delete(doc(db,"apadrinhados_privado",id));lg(b,"terceirizado_excluido","Excluiu o terceirizado "+n0,n0);await b.commit();render(true)},

  async delServ(id){if(!confirm("Excluir este servidor? (A conta de login dele continua existindo, mas sem acesso.)"))return;{const n0=S.adm.serv.find(y=>y.id===id)?.nome||"",b=writeBatch(db);b.delete(doc(db,"servidores",id));lg(b,"servidor_excluido","Excluiu o servidor "+n0,n0);await b.commit()}render(true)},

};
window.W=W;
