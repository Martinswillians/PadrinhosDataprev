<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natal Solidário Dataprev | Café da manhã de Natal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#123628;--pine2:#1d4d3a;--berry:#a3202f;--berry2:#861926;--gold:#d6a24a;--snow:#f4f8f5;--frost:#dce8e2;--ink:#0e211a;--mute:#5b6f66;--line:#cfdcd5;--white:#fff;
--serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 var(--sans);color:var(--ink);background:var(--snow)}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2.1rem,5vw,3.6rem)}h2{font-size:clamp(1.6rem,3vw,2.2rem)}h3{font-size:1.2rem}
a{color:var(--berry)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{background:var(--pine);color:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;color:#fff;text-decoration:none;margin-right:auto}
.brand i{color:var(--gold);font-style:normal}
nav.n a,nav.n button{color:#e6efe9;text-decoration:none;font:500 .95rem var(--sans);background:none;border:0;cursor:pointer;padding:6px 10px;border-radius:6px}
nav.n a:hover,nav.n button:hover{background:var(--pine2)}
nav.n{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--berry);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:600 1rem var(--sans);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--berry2)}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{background:#c4903b}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{background:var(--frost)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.danger{background:#fff;color:var(--berry);border:1.5px solid var(--berry)}
.btn:disabled{opacity:.5;cursor:wait}
.hero{background:var(--pine);color:#fff;padding:56px 0 70px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.hero p.lead{font-size:1.15rem;color:#cfe0d6;max-width:46ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .prazo{display:inline-block;margin-top:22px;color:var(--gold);font-weight:600}
.bigtag{background:#fff;color:var(--ink);border-radius:10px 10px 18px 18px;padding:46px 28px 28px;transform:rotate(4deg);position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35);max-width:300px;justify-self:center}
.bigtag:before{content:"";position:absolute;top:14px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--pine);box-shadow:0 0 0 4px var(--gold)}
.bigtag:after{content:"";position:absolute;top:-70px;left:50%;width:2px;height:84px;background:var(--gold);transform:rotate(-8deg);transform-origin:bottom}
.bigtag small{color:var(--mute);display:block}
.bigtag .para{font-family:var(--serif);font-size:1.9rem;font-weight:700;line-height:1.1;margin:2px 0 16px}
.bigtag .msg{font-family:var(--serif);font-style:italic;color:var(--berry);font-size:1.1rem;border-top:1px dashed var(--line);padding-top:14px}
section.s{padding:56px 0}
section.s.alt{background:var(--white);border-block:1px solid var(--line)}
.prose{max-width:68ch;font-family:var(--serif);font-size:1.15rem;line-height:1.7}
.prose p{margin:0 0 1em}
.regras{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:28px}
.regras div{border-left:4px solid var(--gold);padding:4px 0 4px 16px}
.regras b{display:block;font-family:var(--serif);font-size:1.15rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:22px 0}
.stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px}
.stat b{display:block;font:700 2.3rem var(--serif);line-height:1}
.stat span{color:var(--mute);font-size:.92rem}
.stat.ok b{color:var(--pine2)}.stat.falta b{color:var(--berry)}
.bar{height:14px;background:var(--frost);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pine2),var(--gold));border-radius:99px}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.prof .bar{height:8px;margin-top:6px}.prof small{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:500 .93rem var(--sans)}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 22px;padding-top:14px}
.tag{background:#fff;border:1px solid var(--line);border-radius:10px 10px 16px 16px;padding:40px 18px 20px;position:relative;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.tag:before{content:"";position:absolute;top:12px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--snow);box-shadow:0 0 0 3px var(--gold),inset 0 0 0 1px var(--line)}
.tag:after{content:"";position:absolute;top:-16px;left:50%;width:2px;height:30px;background:var(--gold)}
.tag .role{color:var(--berry);font-weight:600}
.tag .desc{color:var(--mute);font-size:.94rem;flex:1}
.av{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--frost);display:grid;place-items:center;font:700 2rem var(--serif);color:var(--pine2);border:3px solid var(--gold)}
.av.sm{width:42px;height:42px;font-size:1rem;border-width:2px}.av.lg{width:170px;height:170px;font-size:3rem}
.done{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.done .av{opacity:.8;border-color:var(--pine2)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;max-width:560px;margin:40px auto}
.box.wide{max-width:900px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.msg-ok,.msg-info{padding:12px 14px;border-radius:8px;margin:14px 0}
.msg-ok{background:#e3f1e8;border:1px solid #b6d7c2}.msg-info{background:#fbf2dc;border:1px solid #ecd391}
.perfil{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start}
.fotobox{display:flex;gap:14px;align-items:center}.fotobox img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--frost);border:2px solid var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:24px 0}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink);font-weight:600;border-radius:8px 8px 0 0}
.tabs a.on{background:var(--pine);color:#fff}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;margin:14px 0 26px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--frost);font-weight:600;white-space:nowrap}
td .btn{margin:2px 2px 2px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600}
.pill.ok{background:#d8eddf;color:#1d5a37}.pill.no{background:#f9dcdf;color:var(--berry2)}
dialog{border:0;border-radius:14px;padding:26px;width:min(560px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,30,22,.6)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;z-index:99;display:none;max-width:90vw}
footer{background:var(--pine);color:#a9c2b5;padding:28px 0;text-align:center;font-size:.9rem}
.load{text-align:center;padding:80px 0;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.seg{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:8px 0 18px}
.seg button{border:0;background:none;padding:10px 16px;font:600 1rem var(--sans);cursor:pointer;border-radius:8px 8px 0 0;color:var(--ink)}
.seg button.on{background:var(--pine);color:#fff}
.tag .pill{align-self:center}
.req{color:var(--berry);font-weight:700}
.nota{color:var(--mute);font-size:.88rem;margin:12px 0 0}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 6px;align-items:center}
.pill.an{background:#fbf0c9;color:#7a5800}
.itens{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:18px 0}
.prod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.prod img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:10px}
.prod .ph{aspect-ratio:4/3;display:grid;place-items:center;background:var(--frost);border-radius:10px;font-size:3.4rem}
.prod h3{margin:6px 0 0;font-size:1.25rem}.prod p{margin:0;color:var(--mute);flex:1}.prod .preco{font:700 1.5rem var(--serif);color:var(--berry)}
.pix{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center;margin:10px 0}.chave{font:700 1.5rem var(--serif);word-break:break-all;margin:6px 0}
@media(max-width:700px){.pix{grid-template-columns:1fr}}
.cnt{color:var(--mute);margin:4px 0 0;font-size:.92rem}
.qr{width:min(260px,100%);margin:10px auto;border:1px solid var(--line);border-radius:12px;overflow:hidden}.qr svg{display:block;width:100%;height:auto}.urlq{word-break:break-all;color:var(--mute);font-size:.82rem}
@media(max-width:820px){.deco:before{display:none}}

const emv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
const asc=(t,n)=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").trim().slice(0,n)||"NATAL DATAPREV";
function pixPayload(tipo,chave,valor,nome,cidade){
  const dig=String(chave||"").replace(/\D/g,"");
  const k=tipo==="Telefone"?(String(chave).startsWith("+")?String(chave).replace(/[^\d+]/g,""):"+55"+dig):tipo==="CPF/CNPJ"?dig:String(chave||"").trim();
  const p=emv("00","01")+emv("01","12")+emv("26",emv("00","br.gov.bcb.pix")+emv("01",k))+emv("52","0000")+emv("53","986")+(valor>0?emv("54",Number(valor).toFixed(2)):"")+emv("58","BR")+emv("59",asc(nome,25).toUpperCase())+emv("60",asc(cidade||"BRASILIA",15).toUpperCase())+emv("62",emv("05","***"))+"6304";
  return p+crc16(p);
}
async function lerComprovante(file){
  if(file.type.startsWith("image/")){let d=await resize(file,1200);if(d.length>850000)d=await resize(file,800);return {dados:d,tipo:"image/jpeg",nome:file.name}}
  if(file.type==="application/pdf"){if(file.size>650*1024)throw new Error("O PDF tem mais de 650 KB. Envie uma foto ou print do comprovante, ou um PDF menor.");
    const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});return {dados:d,tipo:"application/pdf",nome:file.name}}
  throw new Error("Envie uma imagem (foto ou print) ou um PDF.");
}

async function entrar(p,q){
  return `<div class="box"><h2>Entrar</h2>
  <form onsubmit="W.login(event)"><label for="le">E-mail</label><input id="le" type="email" required autocomplete="username">
  <label for="ls">Senha</label><input id="ls" type="password" required autocomplete="current-password">
  <div class="row"><button class="btn">Entrar</button><button type="button" class="btn ghost" onclick="W.reset()">Esqueci a senha</button></div></form>
  <p style="margin-top:22px">Ainda não tem cadastro? O cadastro de servidores é feito pelo link de convite enviado pela coordenação. Não recebeu o convite ou seu e-mail não está na lista? <a href="#/acesso">Peça acesso ao administrador</a>.</p>
  <hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="btn ghost" onclick="W.google()">Sou administrador: entrar com Google</button></div>`;
}

async function cadastro(p,q){
  const id=q.get("convite");if(!id)return `<div class="box"><h2>Convite necessário</h2><p>Use o link de convite que a coordenação enviou para você. Não recebeu? <a href="#/acesso">Peça acesso ao administrador</a>.</p></div>`;
  const c=await getDoc(doc(db,"convites",id));
  if(!c.exists())return `<div class="box"><h2>Convite inválido</h2><p>Confira o link recebido ou <a href="#/acesso">peça um novo convite ao administrador</a>.</p></div>`;
  const cv=c.data();
  if(cv.usado&&!cv.multi)return `<div class="box"><h2>Convite já utilizado</h2><p>Este convite já foi usado para criar um cadastro. <a href="#/entrar">Entre com seu e-mail e senha.</a></p></div>`;
  const f=FS.concat([{k:"senha",l:"Crie uma senha (mínimo 6 caracteres)",t:"password",req:1}]);
  return `<div class="box wide"><h2>Cadastro de servidor${cv.nome?`: olá, ${esc(cv.nome.split(" ")[0])}!`:""}</h2><p>Preencha seus dados para participar do café da manhã de Natal.</p>
  <form onsubmit="W.cadastrar(event,'${id}',${cv.multi?1:0})">${f.map(x=>fld(x,x.k==="nome"?cv.nome:x.k==="email"?cv.email:(cv[x.k]||""))).join("")}<p class="nota"><span class="req">*</span> Campos obrigatórios</p><div class="row"><button class="btn">Concluir cadastro</button></div></form></div>`;
}

async function acesso(){
  const R='<span class="req" aria-hidden="true">*</span>';
  return `<div class="box"><h2>Peça seu acesso</h2><p>Se você é servidor da Dataprev e não recebeu o convite, ou seu e-mail não está na lista, envie uma mensagem ao administrador. Ele vai responder com o link de cadastro.</p>
  <form onsubmit="W.solicitar(event)"><label for="sn">Nome completo ${R}</label><input id="sn" name="nome" required maxlength="120" value="${esc(S.perfil?.nome||S.user?.displayName||"")}">
  <label for="se">E-mail para receber o convite ${R}</label><input id="se" name="email" type="email" required maxlength="160" value="${esc(S.user?.email||"")}">
  <label for="sa">Área ${R}</label><input id="sa" name="area" required maxlength="120"><label for="sl">Lotação ${R}</label><input id="sl" name="lotacao" required maxlength="120">
  <label for="sf">Telefone para contato</label><input id="sf" name="fone" type="tel" maxlength="30" placeholder="(61) 90000-0000">
  <label for="sm">Mensagem</label><textarea id="sm" name="mensagem" maxlength="800"></textarea>
  <input name="site" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <p class="nota">${R} Campos obrigatórios</p><div class="row"><button class="btn">Enviar solicitação</button></div></form></div>`;
}

async function atividades(){
  if(!S.user){sessionStorage.next="#/atividades";location.hash="#/entrar";return ""}
  const l=(await getDocs(query(collection(db,"logs"),where("usuarioId","==",S.user.uid)))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds||0)-(a.criadoEm?.seconds||0));
  return `<div class="wrap" style="padding:36px 20px 60px"><h2>Minha atividade</h2><p>Registro das suas ações no sistema: comprovantes enviados, confirmações e alterações do perfil.</p>
  <p class="cnt">${l.length} ${l.length===1?"registro":"registros"}</p><div class="tw"><table><thead><tr><th>Data e hora</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>${logRows(l,false)}</tbody></table></div></div>`;
}

async function perfil(){
  if(!S.user){sessionStorage.next="#/perfil";location.hash="#/entrar";return ""}
  if(!S.perfil&&!S.admin)return `<div class="box"><h2>Cadastro pendente</h2><p>Sua conta ainda não tem cadastro de servidor. Use o link de convite da coordenação ou <a href="#/acesso">peça acesso ao administrador</a>.</p></div>`;
  let v=S.perfil,f=FS;
  if(!v){f=FP;try{v=(await getDoc(doc(db,"admins",S.user.email.toLowerCase()))).data()||{}}catch{v={}}}
  return `<div class="box wide"><h2>Meu perfil</h2><p>Conta de acesso: <b>${esc(S.user.email)}</b>. Aqui você atualiza foto, nome, área, lotação, contato e descrição.</p>
  <form onsubmit="W.salvarPerfil(event)">${f.map(x=>fld(x,v[x.k]||"")).join("")}<p class="nota"><span class="req">*</span> Campos obrigatórios</p><div class="row"><button class="btn">Salvar alterações</button></div></form></div>`;
}

async function contribuir(){
  if(!S.user){sessionStorage.next="#/contribuir";location.hash="#/entrar";return ""}
  if(S.admin&&!S.perfil)return `<div class="box"><h2>Contribuições</h2><p>Como administrador, acompanhe e confirme as contribuições no <a href="#/admin/contribuicoes">painel</a>.</p></div>`;
  if(!S.perfil)return `<div class="box"><h2>Cadastro pendente</h2><p>Sua conta ainda não tem cadastro de servidor. Use o link ou o QR Code de convite da coordenação ou <a href="#/acesso">peça acesso ao administrador</a>.</p></div>`;
  const id=S.cfg.ano+"_"+S.user.uid;let c=null;
  try{const d=await getDoc(doc(db,"contribuicoes",id));if(d.exists())c={id,...d.data()}}catch{}
  S.minha=c;
  const cf=S.cfg,pay=pixPayload(cf.tipoChave,cf.chavePix,cf.valorContribuicao,cf.nomeRecebedor,cf.cidadeRecebedor),conf=c?.status==="confirmado";S.pay=pay;
  const R='<span class="req" aria-hidden="true">*</span>';
  const estado=!c?"":c.status==="confirmado"?`<div class="msg-ok">Contribuição de ${brl(c.valor)} <b>confirmada</b>. Obrigado por participar do Natal solidário! Nos vemos no café da manhã em ${fmt(cf.dataEntrega)}.</div>`
    :c.status==="recusada"?`<div class="msg-info"><b>Comprovante recusado.</b> ${esc(c.obsAdmin||"")} Envie um novo comprovante abaixo.</div>`
    :`<div class="msg-info">Recebemos seu comprovante${c.enviadoEm?" em "+dt(c.enviadoEm):""}. A coordenação vai conferir e confirmar em breve.</div>`;
  return `<div class="box wide"><h2>Olá, ${esc(S.perfil.nome.split(" ")[0])}! Sua contribuição</h2>
  <p>O café da manhã de Natal será em <b>${fmt(cf.dataEntrega)}</b>. A contribuição é de <b>${brl(cf.valorContribuicao)}</b> por servidor e será usada para comprar panetones ou cestas de Natal para os colegas terceirizados e para o café.</p>
  ${estado}
  ${conf?"":`<h3>1. Faça o PIX</h3>
  <div class="pix"><div class="qr">${qrSvg(pay)}</div><div><p>Aponte a câmera do aplicativo do seu banco para o QR Code ou use a chave PIX:</p><p class="chave">${esc(cf.chavePix)}</p>
  <div class="row"><button class="btn sm ghost" onclick="W.pix('chave')">Copiar chave</button><button class="btn sm ghost" onclick="W.pix('copia')">Copiar PIX copia e cola</button></div>
  <p class="nota">Valor: ${brl(cf.valorContribuicao)}. Recebedor: ${esc(cf.nomeRecebedor)}.</p></div></div>
  <h3 style="margin-top:26px">2. Envie o comprovante</h3>
  <form onsubmit="W.enviarComprovante(event)"><label for="vl">Valor pago (R$) ${R}</label><input id="vl" name="valor" type="number" step="any" min="1" required value="${c?.valor||cf.valorContribuicao}">
  <label for="ar">Comprovante (foto, print ou PDF) ${R}</label><input id="ar" name="arquivo" type="file" accept="image/*,application/pdf" required>
  <p class="nota">${R} Campos obrigatórios</p>
  <div class="row"><button class="btn">${c?"Reenviar comprovante":"Enviar comprovante"}</button>${c?.comprovanteNome?`<button type="button" class="btn ghost" onclick="W.verComp('${id}')">Ver comprovante enviado</button>`:""}</div></form>`}
  </div>`;
}

async function admin(p){
  if(!S.admin){location.hash="#/entrar";return ""}
  await loadAdmin();
  const A=S.adm,C=A.contrib,cmap=Object.fromEntries(C.map(x=>[x.servidorId,x]));
  const soma=st=>C.filter(x=>x.status===st).reduce((a,x)=>a+(+x.valor||0),0),nConf=C.filter(x=>x.status==="confirmado").length,nAn=C.filter(x=>x.status==="em_analise").length;
  const semC=A.serv.filter(x=>!cmap[x.id]);
  const pend=A.conv.filter(c=>!c.multi&&!c.usado),solP=(A.sol||[]).filter(x=>x.status==="pendente");
  const tabs=[["resumo","Resumo",1],["contribuicoes","Contribuições"+(nAn?" ("+nAn+")":""),S.perms.contribuicoes],["compras","Comparativo de compra",S.perms.contribuicoes],["terceirizados","Terceirizados",S.perms.terceirizados],["servidores","Servidores",S.perms.servidores],["convites","Convites"+(solP.length?" ("+solP.length+")":""),S.perms.convites],["qr","QR Code",S.perms.convites],["campanha","Campanha",S.perms.campanha],["logs","Registro de atividades",S.perms.logs],["admins","Administradores",S.super]].filter(t=>t[2]);
  const tab=tabs.some(t=>t[0]===(p[1]||"resumo"))?(p[1]||"resumo"):"resumo";
  if(tab==="logs"){try{S.logErr="";S.logs=(await getDocs(query(collection(db,"logs"),orderBy("criadoEm","desc"),limit(1000)))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){S.logs=[];S.logErr=e.code||e.message}}
  const solHtml=`<h3>Solicitações de acesso (${solP.length})</h3><div class="tw"><table><tr><th>Nome</th><th>E-mail / Telefone</th><th>Área / Lotação</th><th>Mensagem</th><th>Ações</th></tr>${solP.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.email)}<br><small>${esc(x.fone||"sem telefone")}</small></td><td>${esc(x.area)}<br><small>${esc(x.lotacao||"")}</small></td><td>${esc(x.mensagem||"")}</td><td><button class="btn sm" onclick="W.atender('${x.id}')">Gerar convite</button>${x.fone?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/${waNum(x.fone)}">WhatsApp</a>`:""}<button class="btn sm danger" onclick="W.descartarSol('${x.id}')">Descartar</button></td></tr>`).join("")||'<tr><td colspan="5">Nenhuma solicitação pendente.</td></tr>'}</table></div>`;
  const cmp=(a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{sensitivity:"base"});
  const pill=x=>{const [lb,cl]=ST[x.status]||[x.status,"an"];return `<span class="pill ${cl}">${lb}</span>`};
  const rowAp=a=>{const pv=A.priv[a.id]||{};
    return `<tr><td>${av(a,"sm")}</td><td>${esc(a.nome)}<br><small>${a.idade?a.idade+" anos":""}</small></td><td>${esc(a.profissao)}<br><small>${esc(a.lotacao)}</small></td><td>${esc(pv.email||"")}</td>
     <td><button class="btn sm ghost" onclick="W.editAp('${a.id}')">Editar</button><button class="btn sm danger" onclick="W.delAp('${a.id}')">Excluir</button></td></tr>`};
  const listAp=()=>{const f=S.fa,l=S.ap.filter(a=>has(a.nome,f.q)&&(!f.prof||a.profissao===f.prof)&&has(a.lotacao,f.lot)).sort(cmp);
    return {txt:`${l.length} de ${S.ap.length} terceirizados`,h:l.map(rowAp).join("")||'<tr><td colspan="5">Nenhum terceirizado encontrado.</td></tr>'}};
  const rowServ=x=>{const c=cmap[x.id];return `<tr><td>${av(x,"sm")}</td><td>${esc(x.nome)}</td><td>${esc(x.area)}<br><small>${esc(x.lotacao)}</small></td><td>${esc(x.email||"")}</td><td>${c?pill(c)+"<br><small>"+brl(c.valor)+"</small>":'<span class="pill no">Sem contribuição</span>'}</td><td><button class="btn sm ghost" onclick="W.editServ('${x.id}')">Editar</button><button class="btn sm danger" onclick="W.delServ('${x.id}')">Excluir</button></td></tr>`};
  const listServ=()=>{const f=S.fs,l=A.serv.filter(x=>has(x.nome,f.q)&&has(x.area,f.area)&&has(x.lotacao,f.lot)&&(!f.sit||(f.sit==="sem"?!cmap[x.id]:cmap[x.id]?.status===f.sit))).sort(cmp);
    return {txt:`${l.length} de ${A.serv.length} servidores`,h:l.map(rowServ).join("")||'<tr><td colspan="6">Nenhum servidor encontrado.</td></tr>'}};
  const rowC=x=>`<tr><td>${esc(x.servidorNome)}<br><small>${esc(x.area||"")} / ${esc(x.lotacao||"")}</small></td><td>${brl(x.valor)}${x.manual?"<br><small>registrado pelo adm</small>":""}</td><td>${pill(x)}${x.status==="recusada"&&x.obsAdmin?`<br><small>${esc(x.obsAdmin)}</small>`:""}</td><td>${esc(dh(x.enviadoEm||x.criadoEm))}</td><td>${x.comprovanteNome?`<button class="btn sm ghost" onclick="W.verComp('${x.id}')">Ver</button>`:"-"}</td>
    <td>${x.status!=="confirmado"?`<button class="btn sm" onclick="W.confirmar('${x.id}')">Confirmar</button>`:`<button class="btn sm ghost" onclick="W.desfazerConf('${x.id}')">Desfazer</button>`}${x.status!=="recusada"?`<button class="btn sm danger" onclick="W.recusar('${x.id}')">Recusar</button>`:""}<button class="btn sm danger" aria-label="Excluir contribuição" onclick="W.delContrib('${x.id}')">×</button></td></tr>`;
  const listC=()=>{const f=S.fc,l=C.filter(x=>has(x.servidorNome,f.q)&&(!f.st||x.status===f.st)&&(has(x.area,f.lot)||has(x.lotacao,f.lot))).sort((a,b)=>a.servidorNome.localeCompare(b.servidorNome,"pt-BR",{sensitivity:"base"}));
    const n=semC.filter(x=>has(x.nome,f.q)&&(has(x.area,f.lot)||has(x.lotacao,f.lot))).sort(cmp);
    return {txt:`${l.length} de ${C.length} contribuições`,h:l.map(rowC).join("")||'<tr><td colspan="6">Nenhuma contribuição encontrada.</td></tr>',
      txt2:`${n.length} de ${semC.length} servidores`,h2:n.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.area||"")} / ${esc(x.lotacao||"")}</td><td>${esc(x.email||"")}</td><td><button class="btn sm ghost" onclick="W.regManual('${x.id}')">Registrar pagamento</button></td></tr>`).join("")||'<tr><td colspan="4">Todos os servidores filtrados já contribuíram.</td></tr>'}};

  S.rows={fa:listAp,fs:listServ,fl:listLog,fc:listC};
  let body="";
  if(tab==="resumo")body=`<div class="dash">
    <div class="stat ok"><b>${brl(soma("confirmado"))}</b><span>arrecadado (${nConf} confirmadas)</span></div><div class="stat"><b>${brl(soma("em_analise"))}</b><span>em análise (${nAn})</span></div>
    <div class="stat"><b>${A.serv.length}</b><span>servidores cadastrados</span></div><div class="stat falta"><b>${semC.length}</b><span>ainda não contribuíram</span></div>
    <div class="stat falta"><b>${pend.length}</b><span>convidados sem cadastro</span></div><div class="stat"><b>${S.ap.length}</b><span>colegas a presentear</span></div><div class="stat falta"><b>${solP.length}</b><span>pedidos de acesso pendentes</span></div></div>
    <p>Café da manhã de Natal em ${fmt(S.cfg.dataEntrega)} (${diasRestantes()} dias). Contribuição de ${brl(S.cfg.valorContribuicao)} por servidor.</p>
    <div class="two"><div><h3>Aguardando conferência (${nAn})</h3>${C.filter(x=>x.status==="em_analise").map(x=>`<div>${esc(x.servidorNome)} <small>${brl(x.valor)}</small></div>`).join("")||"<p>Nenhum comprovante pendente.</p>"}${nAn?'<p><a href="#/admin/contribuicoes">Conferir agora</a></p>':""}</div>
    <div><h3>Ainda não contribuíram (${semC.length})</h3>${semC.slice(0,40).map(x=>`<div>${esc(x.nome)} <small>${esc(x.area||"")}</small></div>`).join("")||"<p>Todos os cadastrados já contribuíram.</p>"}${semC.length>40?`<p>e mais ${semC.length-40}…</p>`:""}</div></div>
    <h3 style="margin-top:20px">Convidados sem cadastro (${pend.length})</h3>${pend.map(c=>`<div>${esc(c.nome)} <small>${esc(c.email||"")}</small></div>`).join("")||"<p>Nenhum pendente.</p>"}`;
  if(tab==="contribuicoes"){const r=listC(),f=S.fc;body=`<div class="dash"><div class="stat ok"><b>${brl(soma("confirmado"))}</b><span>confirmado (${nConf})</span></div><div class="stat"><b>${brl(soma("em_analise"))}</b><span>em análise (${nAn})</span></div><div class="stat falta"><b>${semC.length}</b><span>servidores sem contribuição</span></div></div>
    <div class="row"><button class="btn" onclick="W.regManual()">+ Registrar contribuição</button><button class="btn ghost" onclick="W.csvContrib()">Baixar lista (CSV)</button></div>

    <h3>Contribuições</h3><p class="cnt" id="cntC" aria-live="polite">${r.txt}</p>
    <div class="tw"><table><thead><tr><th>Servidor</th><th>Valor</th><th>Status</th><th>Enviado em</th><th>Comprovante</th><th>Ações</th></tr></thead><tbody id="tbC">${r.h}</tbody></table></div>
    <h3>Ainda não contribuíram</h3><p class="cnt" id="cntN" aria-live="polite">${r.txt2}</p>
    <div class="tw"><table><thead><tr><th>Servidor</th><th>Área / Lotação</th><th>E-mail</th><th>Ação</th></tr></thead><tbody id="tbN">${r.h2}</tbody></table></div>`}
  if(tab==="compras"){const arr=soma("confirmado"),arrAn=soma("em_analise"),res=+S.cfg.reservaCafe||0,disp=Math.max(0,arr-res),disp2=Math.max(0,arr+arrAn-res),n=S.ap.length;
    const lin=S.cfg.itens.map(it=>{const p=+it.preco||0,q=p>0?Math.floor(disp/p):0,q2=p>0?Math.floor(disp2/p):0,sal=disp-p*n;

  return `<div class="wrap" style="padding:30px 20px 60px"><h2>Painel da campanha ${S.cfg.ano}</h2><div class="tabs">${tabs.map(([k,l])=>`<a href="#/admin/${k}" class="${k===tab?"on":""}">${l}</a>`).join("")}</div>${body}</div>`;

const svgPng=(svg,px)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=px;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,px,px);x.imageSmoothingEnabled=false;x.drawImage(i,0,0,px,px);c.toBlob(ok,"image/png")};i.onerror=no;i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});

function posterQR(k,url){

  const w=window.open("","_blank");if(!w)return toast("O navegador bloqueou a janela. Libere pop-ups para este site.");

  w.document.write(`<!DOCTYPE html><meta charset="utf-8"><title>Cartaz QR Code</title>${css}<div class="c"><div class="f">${luzes(210)}<div class="r1">${RAMO}</div><div class="r2">${RAMO}</div><div class="st">★</div><div class="k">Café da manhã de Natal Dataprev ${S.cfg.ano}</div><h1>${T[0]}</h1><p class="d">${T[1]}</p><div class="qb">${qrSvg(url)}</div><p class="u">${esc(url)}</p><p class="e">Contribuição: ${brl(S.cfg.valorContribuicao)}<br>Café da manhã em ${fmt(S.cfg.dataEntrega)}</p></div></div>`);
  w.document.close();w.focus();setTimeout(()=>w.print(),500)}
