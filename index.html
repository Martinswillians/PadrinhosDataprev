<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padrinhos Dataprev | Natal e Ano Novo Solidário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#123628;--pine2:#1d4d3a;--berry:#a3202f;--berry2:#861926;--gold:#d6a24a;--snow:#f4f8f5;--frost:#dce8e2;--ink:#0e211a;--mute:#5b6f66;--line:#cfdcd5;--white:#fff;
--serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 var(--sans);color:var(--ink);background:var(--snow)}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2.1rem,5vw,3.6rem)}h2{font-size:clamp(1.6rem,3vw,2.2rem)}h3{font-size:1.2rem}
a{color:var(--berry)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{background:var(--pine);color:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;color:#fff;text-decoration:none;margin-right:auto}
.brand i{color:var(--gold);font-style:normal}
nav.n a,nav.n button{color:#e6efe9;text-decoration:none;font:500 .95rem var(--sans);background:none;border:0;cursor:pointer;padding:6px 10px;border-radius:6px}
nav.n a:hover,nav.n button:hover{background:var(--pine2)}
nav.n{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--berry);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:600 1rem var(--sans);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--berry2)}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{background:#c4903b}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{background:var(--frost)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.danger{background:#fff;color:var(--berry);border:1.5px solid var(--berry)}
.btn:disabled{opacity:.5;cursor:wait}
.hero{background:var(--pine);color:#fff;padding:56px 0 70px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.hero p.lead{font-size:1.15rem;color:#cfe0d6;max-width:46ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .prazo{display:inline-block;margin-top:22px;color:var(--gold);font-weight:600}
.bigtag{background:#fff;color:var(--ink);border-radius:10px 10px 18px 18px;padding:46px 28px 28px;transform:rotate(4deg);position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35);max-width:300px;justify-self:center}
.bigtag:before{content:"";position:absolute;top:14px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--pine);box-shadow:0 0 0 4px var(--gold)}
.bigtag:after{content:"";position:absolute;top:-70px;left:50%;width:2px;height:84px;background:var(--gold);transform:rotate(-8deg);transform-origin:bottom}
.bigtag small{color:var(--mute);display:block}
.bigtag .para{font-family:var(--serif);font-size:1.9rem;font-weight:700;line-height:1.1;margin:2px 0 16px}
.bigtag .msg{font-family:var(--serif);font-style:italic;color:var(--berry);font-size:1.1rem;border-top:1px dashed var(--line);padding-top:14px}
section.s{padding:56px 0}
section.s.alt{background:var(--white);border-block:1px solid var(--line)}
.prose{max-width:68ch;font-family:var(--serif);font-size:1.15rem;line-height:1.7}
.prose p{margin:0 0 1em}
.regras{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:28px}
.regras div{border-left:4px solid var(--gold);padding:4px 0 4px 16px}
.regras b{display:block;font-family:var(--serif);font-size:1.15rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:22px 0}
.stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px}
.stat b{display:block;font:700 2.3rem var(--serif);line-height:1}
.stat span{color:var(--mute);font-size:.92rem}
.stat.ok b{color:var(--pine2)}.stat.falta b{color:var(--berry)}
.bar{height:14px;background:var(--frost);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pine2),var(--gold));border-radius:99px}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.prof .bar{height:8px;margin-top:6px}.prof small{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:500 .93rem var(--sans)}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 22px;padding-top:14px}
.tag{background:#fff;border:1px solid var(--line);border-radius:10px 10px 16px 16px;padding:40px 18px 20px;position:relative;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.tag:before{content:"";position:absolute;top:12px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--snow);box-shadow:0 0 0 3px var(--gold),inset 0 0 0 1px var(--line)}
.tag:after{content:"";position:absolute;top:-16px;left:50%;width:2px;height:30px;background:var(--gold)}
.tag .role{color:var(--berry);font-weight:600}
.tag .desc{color:var(--mute);font-size:.94rem;flex:1}
.av{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--frost);display:grid;place-items:center;font:700 2rem var(--serif);color:var(--pine2);border:3px solid var(--gold)}
.av.sm{width:42px;height:42px;font-size:1rem;border-width:2px}.av.lg{width:170px;height:170px;font-size:3rem}
.done{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.done .av{opacity:.8;border-color:var(--pine2)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;max-width:560px;margin:40px auto}
.box.wide{max-width:900px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.msg-ok,.msg-info{padding:12px 14px;border-radius:8px;margin:14px 0}
.msg-ok{background:#e3f1e8;border:1px solid #b6d7c2}.msg-info{background:#fbf2dc;border:1px solid #ecd391}
.perfil{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start}
.fotobox{display:flex;gap:14px;align-items:center}.fotobox img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--frost);border:2px solid var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:24px 0}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink);font-weight:600;border-radius:8px 8px 0 0}
.tabs a.on{background:var(--pine);color:#fff}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;margin:14px 0 26px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--frost);font-weight:600;white-space:nowrap}
td .btn{margin:2px 2px 2px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600}
.pill.ok{background:#d8eddf;color:#1d5a37}.pill.no{background:#f9dcdf;color:var(--berry2)}
dialog{border:0;border-radius:14px;padding:26px;width:min(560px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,30,22,.6)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;z-index:99;display:none;max-width:90vw}
footer{background:var(--pine);color:#a9c2b5;padding:28px 0;text-align:center;font-size:.9rem}
.load{text-align:center;padding:80px 0;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* ===================== CONFIGURAÇÃO ===================== */
const firebaseConfig={

const WORKER_URL="https://pushpadrinhosdataprev.willbrasilia.workers.dev"; // Cloudflare Worker (envio de e-mails). Deixe "" para desativar.
const PROFS=["Recepção","Segurança","Brigadista","Serviços","Estagiário"];
const PERMS={terceirizados:"Terceirizados (cadastrar, editar e vincular padrinhos)",servidores:"Servidores (cadastrar, editar e excluir)",convites:"Convites de cadastro",entregas:"Presentes, mensagens, impressão e e-mails",campanha:"Dados da campanha (ano e data de entrega)"};
const PERMS_SHORT={terceirizados:"Terceirizados",servidores:"Servidores",convites:"Convites",entregas:"Presentes",campanha:"Campanha"};
/* ======================================================== */

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?d.split("-").reverse().join("/"):"";
const ini=n=>(n||"?").split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const S={fa:{q:"",prof:"",lot:"",sit:""},fs:{q:"",area:"",lot:"",sit:""},aba:"esperam",user:null,admin:false,super:false,perms:{},perfil:null,cfg:{ano:new Date().getFullYear(),dataEntrega:new Date().getFullYear()+"-12-15"},ap:[],filtro:"Todos",busy:false,adm:null,my:[]};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4200)};
const av=(a,c="")=>a?.foto?`<img class="av ${c}" src="${a.foto}" alt="Foto de ${esc(a.nome)}">`:`<div class="av ${c}" aria-hidden="true">${esc(ini(a?.nome))}</div>`;
const g=async n=>(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));
const waNum=t=>{const d=(t||"").replace(/\D/g,"");return d.length<=11?"55"+d:d};
const linkConvite=id=>location.origin+location.pathname+"#/cadastro?convite="+id;

/* ---------- campos de formulário ---------- */
const FA=[{k:"nome",l:"Nome completo",req:1},{k:"profissao",l:"Profissão",t:"select",o:PROFS,req:1},{k:"lotacao",l:"Lotação",req:1},{k:"idade",l:"Idade",t:"number"},{k:"fone",l:"Telefone",t:"tel"},{k:"email",l:"E-mail",t:"email"},{k:"foto",l:"Foto",t:"foto"},{k:"descricao",l:"Descrição do perfil (história, gostos, tamanhos, sonhos)",t:"textarea"}];
const FP=[{k:"nome",l:"Nome completo",req:1},{k:"area",l:"Área"},{k:"lotacao",l:"Lotação"},{k:"fone",l:"Telefone",t:"tel"},{k:"foto",l:"Foto",t:"foto"},{k:"descricao",l:"Descrição",t:"textarea"}];
const FS=[{k:"nome",l:"Nome completo",req:1},{k:"area",l:"Área",req:1},{k:"lotacao",l:"Lotação",req:1},{k:"fone",l:"Telefone",t:"tel"},{k:"email",l:"E-mail",t:"email",req:1},{k:"foto",l:"Foto",t:"foto"},{k:"descricao",l:"Fale um pouco sobre você",t:"textarea"}];
function fld(f,v=""){
  const id="f_"+f.k,r=f.req?"required":"";
  if(f.t==="foto")return `<label>${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><div class="fotobox"><img data-foto data-v="${esc(v)}" src="${v||"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}" alt=""><input type="file" accept="image/*" onchange="W.foto(this)"></div>`;
  if(f.t==="select")return `<label for="${id}">${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><select id="${id}" name="${f.k}" ${r}>${f.o.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  if(f.t==="textarea")return `<label for="${id}">${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  return `<label for="${id}">${f.l}${f.req?` <span class="req" aria-hidden="true">*</span>`:""}</label><input id="${id}" name="${f.k}" type="${f.t||"text"}" value="${esc(v)}" ${r} ${f.t==="password"?'minlength="6" autocomplete="new-password"':""}>`;
}
function read(form,fields){const v={};fields.forEach(f=>{if(f.t==="foto")v.foto=form.querySelector("[data-foto]").dataset.v||"";else{v[f.k]=form.elements[f.k].value.trim();if(f.t==="number")v[f.k]=v[f.k]?+v[f.k]:null}});return v}
function resize(file,max=480){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};i.onerror=no;i.src=r.result};r.readAsDataURL(file)})}
function modal(title,fields,vals,save){
  const d=$("#dlg");
  d.innerHTML=`<form id="mf"><h2>${title}</h2>${fields.map(f=>fld(f,vals[f.k]??"")).join("")}<p class="nota"><span class="req">*</span> Campos obrigatórios</p><div class="row"><button type="button" class="btn ghost" onclick="dlg.close()">Cancelar</button><button class="btn">Salvar</button></div></form>`;
  $("#mf").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await save(read(e.target,fields));d.close();toast("Salvo com sucesso");render(true)}catch(x){toast("Erro: "+x.message);b.disabled=false}};
  d.showModal();
}

/* ---------- dados ---------- */
async function loadPublic(){
  const c=await getDoc(doc(db,"config","campanha"));
  if(c.exists())S.cfg={...S.cfg,...c.data()};
  const q=await getDocs(query(collection(db,"apadrinhados"),where("ano","==",S.cfg.ano)));
  S.ap=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{sensitivity:"base"}));
}
async function refreshProfile(){
  const u=auth.currentUser;S.user=u;S.admin=false;S.super=false;S.perms={};S.perfil=null;
  if(u){
    const em=(u.email||"").toLowerCase();
    if(u.emailVerified&&em===ADMIN_EMAIL){S.admin=S.super=true;Object.keys(PERMS).forEach(k=>S.perms[k]=true)}
    else if(u.emailVerified){try{const a=await getDoc(doc(db,"admins",em));if(a.exists()){S.admin=true;S.perms=a.data().perms||{}}}catch{}}
    try{const p=await getDoc(doc(db,"servidores",u.uid));if(p.exists())S.perfil={id:p.id,...p.data()}}catch{}
  }
  renderNav();
}
async function loadAdmin(){
  const sg=n=>g(n).catch(()=>[]);
  const [serv,conv,aps,priv,admins,sol]=await Promise.all([sg("servidores"),sg("convites"),sg("apadrinhamentos"),sg("apadrinhados_privado"),S.super?sg("admins"):[],sg("solicitacoes")]);
  S.adm={serv:serv.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{sensitivity:"base"})),conv,admins:admins.filter(a=>a.id!==ADMIN_EMAIL),sol,aps:aps.filter(x=>x.ano===S.cfg.ano),priv:Object.fromEntries(priv.map(p=>[p.id,p]))};
}
const tem=a=>(a.padrinhos||0)>0;
const stats=()=>{const t=S.ap.length,d=S.ap.filter(tem).length;return{t,d,f:t-d,pct:t?Math.round(d/t*100):0}};
const diasRestantes=()=>Math.ceil((new Date(S.cfg.dataEntrega+"T23:59:59")-new Date())/864e5);

/* ---------- navegação ---------- */
function renderNav(){
  const n=$("#nav");
  n.innerHTML=`<a href="#/">Campanha</a><a href="#/#apadrinhar">Escolher afilhado</a>`+
   (S.admin?`<a href="#/admin">Painel</a>`:"")+(S.perfil?`<a href="#/meus">Meus afilhados</a>`:"")+(S.user?`<a href="#/perfil">Meu perfil</a><button onclick="W.sair()">Sair</button>`:`<a href="#/entrar">Entrar</a>`);
}
async function render(keep){
  const [path,qs]=location.hash.slice(1).split("?"),p=(path||"/").split("/").filter(Boolean),q=new URLSearchParams(qs||"");

    <div class="filtros"><input type="search" placeholder="Buscar por nome" aria-label="Buscar por nome" value="${esc(f.q)}" oninput="W.filtrar('fa','q',this.value)">
    <select aria-label="Profissão" onchange="W.filtrar('fa','prof',this.value)"><option value="">Todas as profissões</option>${PROFS.map(x=>`<option ${f.prof===x?"selected":""}>${x}</option>`).join("")}</select>
    <input type="search" placeholder="Buscar por lotação" aria-label="Buscar por lotação" value="${esc(f.lot)}" oninput="W.filtrar('fa','lot',this.value)">
    <select aria-label="Situação" onchange="W.filtrar('fa','sit',this.value)"><option value="">Todas as situações</option><option value="sem" ${f.sit==="sem"?"selected":""}>Sem padrinho</option><option value="com" ${f.sit==="com"?"selected":""}>Com padrinho</option></select>
    <button class="btn sm ghost" onclick="W.limpar('fa')">Limpar filtros</button></div><p class="cnt" id="cntA" aria-live="polite">${r.txt}</p>
    <div class="tw"><table><thead><tr><th>Foto</th><th>Nome</th><th>Profissão / Lotação</th><th>Contato</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="tbA">${r.h}</tbody></table></div>`}
  if(tab==="servidores"){const r=listServ(),f=S.fs;body=`<div class="row"><button class="btn" onclick="W.editServ()">+ Cadastrar servidor</button><a class="btn ghost" href="#/admin/convites">Enviar convites</a><button class="btn ghost" onclick="W.csvServ()">Baixar lista (CSV)</button></div>
    <div class="filtros"><input type="search" placeholder="Buscar por nome" aria-label="Buscar por nome" value="${esc(f.q)}" oninput="W.filtrar('fs','q',this.value)">
    <input type="search" placeholder="Buscar por área" aria-label="Buscar por área" value="${esc(f.area)}" oninput="W.filtrar('fs','area',this.value)">
    <input type="search" placeholder="Buscar por lotação" aria-label="Buscar por lotação" value="${esc(f.lot)}" oninput="W.filtrar('fs','lot',this.value)">
    <select aria-label="Situação" onchange="W.filtrar('fs','sit',this.value)"><option value="">Todos os servidores</option><option value="pad" ${f.sit==="pad"?"selected":""}>Padrinhos</option><option value="sem" ${f.sit==="sem"?"selected":""}>Sem afilhado</option></select>
    <button class="btn sm ghost" onclick="W.limpar('fs')">Limpar filtros</button></div><p class="cnt" id="cntS" aria-live="polite">${r.txt}</p>
    <div class="tw"><table><thead><tr><th>Foto</th><th>Nome</th><th>Área / Lotação</th><th>Contato</th><th>Afilhados</th><th>Ações</th></tr></thead><tbody id="tbS">${r.h}</tbody></table></div>`}
  if(tab==="convites")body=solHtml+`<div class="two"><div class="box" style="margin:0;max-width:none"><h3>Convidar um servidor</h3><form onsubmit="W.convidar(event)"><label>Nome</label><input name="nome" required><label>E-mail</label><input name="email" type="email"><div class="row"><button class="btn">Gerar link</button></div></form>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Link aberto (qualquer servidor)</h3><p>Um único link reutilizável, para enviar por e-mail geral ou mural.</p><button class="btn ghost" onclick="W.convidarAberto()">Gerar link aberto</button></div>
    <div class="box" style="margin:0;max-width:none"><h3>Convidar em lote</h3><p>Uma pessoa por linha, no formato <code>Nome;email</code>.</p><form onsubmit="W.lote(event)"><textarea name="lote" style="min-height:150px" placeholder="Maria Silva;maria@dataprev.gov.br"></textarea><div class="row"><button class="btn">Gerar convites</button></div></form></div></div>
    <h3 style="margin-top:30px">Aguardando cadastro (${pend.length})</h3><div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>Enviar</th></tr>${pend.map(c=>{const l=linkConvite(c.id),t=`Olá ${c.nome.split(" ")[0]}! Participe da campanha Padrinhos Dataprev: ${l}`;return `<tr><td>${esc(c.nome)}</td><td>${esc(c.email||"")}</td><td><button class="btn sm ghost" onclick="W.copiar('${l}')">Copiar link</button><a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">WhatsApp</a><a class="btn sm ghost" href="mailto:${esc(c.email||"")}?subject=${encodeURIComponent("Padrinhos Dataprev: seu convite")}&body=${encodeURIComponent(t)}">E-mail</a><button class="btn sm danger" onclick="W.delConv('${c.id}')">Excluir</button></td></tr>`}).join("")||'<tr><td colspan="3">Nenhum convite pendente.</td></tr>'}</table></div>
    <h3>Links abertos</h3><div class="tw"><table>${A.conv.filter(c=>c.multi).map(c=>`<tr><td style="word-break:break-all">${linkConvite(c.id)}</td><td><button class="btn sm ghost" onclick="W.copiar('${linkConvite(c.id)}')">Copiar</button><button class="btn sm danger" onclick="W.delConv('${c.id}')">Excluir</button></td></tr>`).join("")||"<tr><td>Nenhum.</td></tr>"}</table></div>`;
  if(tab==="entregas")body=`<div class="row"><button class="btn" onclick="W.imprimir('all')">Imprimir todos os cartões</button><button class="btn ghost" onclick="W.csvEnt()">Baixar CSV</button>${WORKER_URL?`<button class="btn gold" onclick="W.enviarEmails()">Enviar mensagens por e-mail</button>`:""}</div>
    <div class="tw"><table><tr><th>Apadrinhado</th><th>Padrinho</th><th>Presente</th><th>Mensagem</th><th>Entregue</th></tr>${A.aps.map(x=>`<tr><td>${esc(x.apadrinhadoNome)}</td><td>${esc(x.padrinhoNome)}</td><td>${esc(x.presente)}</td><td>${esc(x.mensagem)}</td><td><input type="checkbox" style="width:auto" ${x.entregue?"checked":""} onchange="W.entregue('${x.id}',this.checked)" aria-label="Entregue"></td></tr>`).join("")||'<tr><td colspan="5">Nenhum apadrinhamento ainda.</td></tr>'}</table></div>`;
  if(tab==="campanha")body=`<div class="box" style="margin:0"><h3>Dados da campanha</h3><form onsubmit="W.salvarCfg(event)"><label>Ano da campanha</label><input name="ano" type="number" value="${S.cfg.ano}" required><label>Data limite de entrega</label><input name="dataEntrega" type="date" value="${S.cfg.dataEntrega}" required><div class="row"><button class="btn">Salvar</button></div></form>
    <p class="msg-info">Para iniciar uma nova campanha, altere o ano. Os dados do ano anterior ficam guardados e a lista de terceirizados começa vazia.</p></div>`;
  if(tab==="admins")body=`<div class="two"><div class="box" style="margin:0;max-width:none"><h3>Novo administrador</h3><p>Informe o e-mail da conta Google da pessoa. Ela entra pelo botão "Sou administrador: entrar com Google".</p>
    <form onsubmit="W.addAdmin(event)"><label>Nome</label><input name="nome" required><label>E-mail Google</label><input name="email" type="email" required><label>Permissões</label>${Object.entries(PERMS).map(([k,l])=>`<label style="font-weight:400"><input type="checkbox" name="p_${k}" style="width:auto" checked> ${l}</label>`).join("")}<div class="row"><button class="btn">Adicionar administrador</button></div></form></div>
    <div class="msg-info" style="align-self:start">O administrador principal (${ADMIN_EMAIL}) tem todas as permissões e é o único que gerencia administradores. Todo administrador vê o Resumo.</div></div>
    <h3 style="margin-top:30px">Administradores (${A.admins.length})</h3><div class="tw"><table><tr><th>Nome / e-mail</th>${Object.keys(PERMS).map(k=>`<th>${PERMS_SHORT[k]}</th>`).join("")}<th></th></tr>${A.admins.map(a=>`<tr><td>${esc(a.nome)}<br><small>${esc(a.email)}</small></td>${Object.keys(PERMS).map(k=>`<td><input type="checkbox" style="width:auto" aria-label="${PERMS_SHORT[k]}" ${a.perms?.[k]?"checked":""} onchange="W.perm('${a.id}','${k}',this.checked)"></td>`).join("")}<td><button class="btn sm danger" onclick="W.delAdmin('${a.id}')">Remover</button></td></tr>`).join("")||'<tr><td colspan="7">Nenhum administrador adicional.</td></tr>'}</table></div>`;
  return `<div class="wrap" style="padding:30px 20px 60px"><h2>Painel da campanha ${S.cfg.ano}</h2><div class="tabs">${tabs.map(([k,l])=>`<a href="#/admin/${k}" class="${k===tab?"on":""}">${l}</a>`).join("")}</div>${body}</div>`;
}

/* ===================== AÇÕES ===================== */
function cartao(x){return `<div class="c"><h1>Feliz Natal e um Próspero Ano Novo!</h1><p class="p">Para <b>${esc(x.apadrinhadoNome)}</b></p><p class="m">${esc(x.mensagem||"Que o novo ano traga paz, saúde e alegria. Obrigado por tudo!").replace(/\n/g,"<br>")}</p><p>Com carinho,<br><b>${esc(x.padrinhoNome)}</b><br>Dataprev</p></div>`}
const cardCss='<style>body{font-family:Georgia,serif;margin:0}.c{page-break-after:always;border:6px double #a3202f;margin:30px;padding:50px 40px;text-align:center;min-height:360px}h1{color:#123628;font-size:28px}.p{font-size:20px}.m{font-size:19px;font-style:italic;margin:30px 0}</style>';
const csv=(rows,name)=>{const t=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download=name;a.click()};
async function liberar(id,afId){const b=writeBatch(db);b.delete(doc(db,"apadrinhamentos",id));b.update(doc(db,"apadrinhados",afId),{padrinhos:increment(-1)});await b.commit()}

const W={
  filtro(f){S.filtro=f;render(true)},
  sair:async()=>{await signOut(auth);S.admin=false;S.perfil=null;await refreshProfile();location.hash="#/";render()},
  async login(e){e.preventDefault();try{await signInWithEmailAndPassword(auth,$("#le").value,$("#ls").value);await refreshProfile();const n=sessionStorage.next;sessionStorage.removeItem("next");location.hash=S.admin?"#/admin":(n||"#/meus");if(!S.admin&&!S.perfil)toast("Conta sem cadastro de servidor: use o link de convite.")}catch(x){toast("E-mail ou senha incorretos.")}},
  async google(){try{const r=await signInWithPopup(auth,new GoogleAuthProvider());await refreshProfile();if(!S.admin){await signOut(auth);await refreshProfile();return toast("Esta conta Google não tem acesso de administrador.")}location.hash="#/admin"}catch(x){toast("Não foi possível entrar: "+x.message)}},
  async reset(){const m=$("#le").value;if(!m)return toast("Digite seu e-mail no campo acima.");try{await sendPasswordResetEmail(auth,m);toast("Enviamos um e-mail para redefinir a senha.")}catch(x){toast("Erro: "+x.message)}},
  foto:async i=>{const f=i.files[0];if(!f)return;const d=await resize(f),im=i.parentElement.querySelector("img");im.src=d;im.dataset.v=d},
  async cadastrar(e,conv,multi){e.preventDefault();const b=e.submitter;b.disabled=true;S.busy=true;
    try{const v=read(e.target,FS.concat([{k:"senha"}])),{senha,...perfil}=v;
      const c=await createUserWithEmailAndPassword(auth,v.email,senha),bt=writeBatch(db);
      bt.set(doc(db,"servidores",c.user.uid),{...perfil,convite:conv,criadoEm:serverTimestamp()});
      if(!multi)bt.update(doc(db,"convites",conv),{usado:true,usadoPor:c.user.uid,usadoEm:serverTimestamp()});
      await bt.commit();S.busy=false;await refreshProfile();toast("Cadastro concluído! Escolha seu afilhado.");location.hash="#/"+(sessionStorage.next?.slice(2)||"");render()
    }catch(x){S.busy=false;b.disabled=false;toast(x.code==="auth/email-already-in-use"?"Este e-mail já tem cadastro. Faça login.":"Erro: "+x.message)}},
  async apadrinhar(e,id){e.preventDefault();const a=S.ap.find(x=>x.id===id),b=writeBatch(db),aid=id+"_"+S.user.uid;e.submitter.disabled=true;
    b.set(doc(db,"apadrinhamentos",aid),{apadrinhadoId:id,apadrinhadoNome:a.nome,padrinhoId:S.user.uid,padrinhoNome:S.perfil.nome,ano:S.cfg.ano,presente:$("#pr").value.trim(),mensagem:$("#ms").value.trim(),entregue:false,criadoEm:serverTimestamp()});
    b.update(doc(db,"apadrinhados",id),{padrinhos:increment(1)});
    try{await b.commit();toast("Obrigado! Você é padrinho de "+a.nome.split(" ")[0]+".");location.hash="#/meus"}catch(x){toast("Não foi possível apadrinhar. Você já apadrinhou este colega?");render()}},
  async salvarPerfil(e){e.preventDefault();const b=e.submitter;b.disabled=true;
    try{const v=read(e.target,S.perfil?FS:FP);
      if(S.perfil){const bt=writeBatch(db);bt.update(doc(db,"servidores",S.user.uid),v);
        if(v.nome!==S.perfil.nome){const q=await getDocs(query(collection(db,"apadrinhamentos"),where("padrinhoId","==",S.user.uid)));q.docs.forEach(d=>bt.update(d.ref,{padrinhoNome:v.nome}))}
        await bt.commit()}
      else await setDoc(doc(db,"admins",S.user.email.toLowerCase()),v,{merge:true});
      await refreshProfile();toast("Perfil atualizado!");render(true)}
    catch(x){toast("Erro: "+x.message)}b.disabled=false},
  filtrar(k,campo,val){S[k][campo]=val;const r=S.rows[k]();$(k==="fa"?"#tbA":"#tbS").innerHTML=r.h;$(k==="fa"?"#cntA":"#cntS").textContent=r.txt},
  limpar(k){S[k]=k==="fa"?{q:"",prof:"",lot:"",sit:""}:{q:"",area:"",lot:"",sit:""};render(true)},
  csvServ(){csv([["Nome","Área","Lotação","Telefone","E-mail","Afilhados"],...S.adm.serv.map(x=>[x.nome,x.area,x.lotacao,x.fone,x.email,S.adm.aps.filter(a=>a.padrinhoId===x.id).map(a=>a.apadrinhadoNome).join(", ")])],"servidores.csv")},
  aba(v){S.aba=v;render(true)},
  async solicitar(e){e.preventDefault();const f=e.target;if(f.site.value)return;e.submitter.disabled=true;
    try{await setDoc(doc(collection(db,"solicitacoes")),{nome:f.nome.value.trim(),email:f.email.value.trim(),area:f.area.value.trim(),lotacao:f.lotacao.value.trim(),fone:f.fone.value.trim(),mensagem:f.mensagem.value.trim(),status:"pendente",criadoEm:serverTimestamp()});
      $("#app").innerHTML=`<div class="box"><h2>Solicitação enviada</h2><p>O administrador recebeu sua mensagem. Assim que o convite for gerado, você receberá o link de cadastro no e-mail informado.</p><a class="btn" href="#/">Voltar à campanha</a></div>`}
    catch(x){toast("Não foi possível enviar: "+x.message);e.submitter.disabled=false}},
  async atender(id){const x=S.adm.sol.find(z=>z.id===id),r=doc(collection(db,"convites")),b=writeBatch(db);b.set(r,{nome:x.nome,email:x.email,fone:x.fone||"",area:x.area||"",lotacao:x.lotacao||"",usado:false,multi:false,criadoEm:serverTimestamp()});b.update(doc(db,"solicitacoes",id),{status:"atendida",conviteId:r.id});await b.commit();await W.copiar(linkConvite(r.id));toast("Convite gerado e link copiado. Envie-o pela lista abaixo.");render(true)},
  async descartarSol(id){if(!confirm("Descartar esta solicitação?"))return;await deleteDoc(doc(db,"solicitacoes",id));render(true)},
  async salvarPresente(e,id){e.preventDefault();const f=e.target;await updateDoc(doc(db,"apadrinhamentos",id),{presente:f.presente.value.trim(),mensagem:f.mensagem.value.trim()});toast("Salvo!")},
  async desistir(id){if(!confirm("Remover este apadrinhamento? Se o colega não tiver outro padrinho, voltará para a lista de quem espera."))return;const x=[...S.my,...(S.adm?.aps||[])].find(z=>z.id===id);await liberar(id,x.apadrinhadoId);toast("Apadrinhamento removido.");render(true)},
  imprimir(id){const l=id==="all"?S.adm.aps:[...S.my,...(S.adm?.aps||[])].filter(x=>x.id===id).slice(0,1);if(!l.length)return toast("Nada para imprimir.");const w=window.open("","_blank");w.document.write(`<!DOCTYPE html><meta charset="utf-8"><title>Cartões</title>${cardCss}${l.map(cartao).join("")}`);w.document.close();w.focus();setTimeout(()=>w.print(),400)},
  /* admin */
  editAp(id){const a=S.ap.find(x=>x.id===id)||{},pv=id?S.adm.priv[id]||{}:{};
    modal(id?"Editar terceirizado":"Cadastrar terceirizado",FA,{...a,...pv},async v=>{const {fone,email,...pub}=v,b=writeBatch(db);
      if(id){b.update(doc(db,"apadrinhados",id),pub)}else{const r=doc(collection(db,"apadrinhados"));id=r.id;b.set(r,{...pub,ano:S.cfg.ano,padrinhos:0,criadoEm:serverTimestamp()})}
      b.set(doc(db,"apadrinhados_privado",id),{fone,email});await b.commit()})},
  async delAp(id){if(!confirm("Excluir este terceirizado?"))return;const b=writeBatch(db);b.delete(doc(db,"apadrinhados",id));b.delete(doc(db,"apadrinhados_privado",id));S.adm.aps.filter(x=>x.apadrinhadoId===id).forEach(x=>b.delete(doc(db,"apadrinhamentos",x.id)));await b.commit();render(true)},
  async assign(id){const sid=$("#as_"+id).value;if(!sid)return toast("Escolha um servidor.");const s=S.adm.serv.find(x=>x.id===sid),a=S.ap.find(x=>x.id===id),b=writeBatch(db);
    b.set(doc(db,"apadrinhamentos",id+"_"+sid),{apadrinhadoId:id,apadrinhadoNome:a.nome,padrinhoId:sid,padrinhoNome:s.nome,ano:S.cfg.ano,presente:"",mensagem:"",entregue:false,criadoEm:serverTimestamp()});
    b.update(doc(db,"apadrinhados",id),{padrinhos:increment(1)});await b.commit();toast("Padrinho vinculado.");render(true)},
  editServ(id){const s=S.adm.serv.find(x=>x.id===id)||{};
    modal(id?"Editar servidor":"Cadastrar servidor",FS,s,async v=>{if(id)await updateDoc(doc(db,"servidores",id),v);else await setDoc(doc(collection(db,"servidores")),{...v,convite:"admin",criadoEm:serverTimestamp()})})},
  async delServ(id){if(!confirm("Excluir este servidor? (A conta de login dele continua existindo, mas sem acesso.)"))return;await deleteDoc(doc(db,"servidores",id));render(true)},
  async convidar(e){e.preventDefault();const f=e.target,r=doc(collection(db,"convites"));await setDoc(r,{nome:f.nome.value.trim(),email:f.email.value.trim(),usado:false,multi:false,criadoEm:serverTimestamp()});await navigator.clipboard?.writeText(linkConvite(r.id)).catch(()=>{});toast("Convite criado. O link foi copiado.");render(true)},
  async convidarAberto(){const r=doc(collection(db,"convites"));await setDoc(r,{nome:"",email:"",usado:false,multi:true,criadoEm:serverTimestamp()});toast("Link aberto criado.");render(true)},
  async lote(e){e.preventDefault();const ls=e.target.lote.value.split("\n").map(l=>l.trim()).filter(Boolean);const b=writeBatch(db);ls.forEach(l=>{const [n,m=""]=l.split(/[;,\t]/);b.set(doc(collection(db,"convites")),{nome:n.trim(),email:m.trim(),usado:false,multi:false,criadoEm:serverTimestamp()})});await b.commit();toast(ls.length+" convites criados.");render(true)},
  async delConv(id){await deleteDoc(doc(db,"convites",id));render(true)},
  async addAdmin(e){e.preventDefault();const f=e.target,em=f.email.value.trim().toLowerCase(),perms={};Object.keys(PERMS).forEach(k=>perms[k]=f["p_"+k].checked);await setDoc(doc(db,"admins",em),{nome:f.nome.value.trim(),email:em,perms,criadoEm:serverTimestamp()});toast("Administrador adicionado.");render(true)},
  async perm(id,k,v){try{await updateDoc(doc(db,"admins",id),{["perms."+k]:v});toast("Permissão atualizada.")}catch(x){toast("Erro: "+x.message)}},
  async delAdmin(id){if(!confirm("Remover este administrador?"))return;await deleteDoc(doc(db,"admins",id));render(true)},
  copiar:async l=>{try{await navigator.clipboard.writeText(l);toast("Link copiado!")}catch{prompt("Copie o link:",l)}},
  async entregue(id,v){await updateDoc(doc(db,"apadrinhamentos",id),{entregue:v})},
  async salvarCfg(e){e.preventDefault();const f=e.target;await setDoc(doc(db,"config","campanha"),{ano:+f.ano.value,dataEntrega:f.dataEntrega.value});toast("Campanha atualizada.");render(true)},
  csvAp(){csv([["Nome","Profissão","Lotação","Idade","Telefone","E-mail","Situação","Padrinho"],...[...S.ap].sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR",{sensitivity:"base"})).map(a=>{const p=S.adm.priv[a.id]||{},x=S.adm.aps.filter(y=>y.apadrinhadoId===a.id);return [a.nome,a.profissao,a.lotacao,a.idade,p.fone,p.email,tem(a)?"Apadrinhado":"Sem padrinho",x.map(z=>z.padrinhoNome).join(", ")]})],"terceirizados.csv")},
  csvEnt(){csv([["Apadrinhado","Padrinho","Presente","Mensagem","Entregue"],...S.adm.aps.map(x=>[x.apadrinhadoNome,x.padrinhoNome,x.presente,x.mensagem,x.entregue?"Sim":"Não"])],"presentes.csv")},
  async enviarEmails(){if(!confirm("Enviar a mensagem de Natal por e-mail para todos os afilhados que têm e-mail cadastrado?"))return;
    const tok=await auth.currentUser.getIdToken();let ok=0,fail=0,sem=0;
    for(const x of S.adm.aps){const em=S.adm.priv[x.apadrinhadoId]?.email;if(!em){sem++;continue}
      try{const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken:tok,to:em,subject:"Feliz Natal, "+x.apadrinhadoNome.split(" ")[0]+"!",html:cartao(x)})});r.ok?ok++:fail++}catch{fail++}}
    toast(`Enviados: ${ok}. Falhas: ${fail}. Sem e-mail: ${sem}.`)}
};
window.W=W;

onAuthStateChanged(auth,async()=>{if(S.busy)return;await refreshProfile();render(true)});
render();
</script>
</body>
